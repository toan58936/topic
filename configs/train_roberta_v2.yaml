run_name: "roberta_v2"
backbone: "roberta"
pooling: "mean"
loss: "huber"
huber_delta: 1.0
seed: 42
max_length: 512
batch_size: 8
gradient_accumulation_steps: 2
epochs: 5
lr: 2e-5
weight_decay: 0.01
warmup_ratio: 0.1
grad_clip: 1.0
fp16: true
num_workers: 0
device: "auto"
log_every: 100
data_dir: "/kaggle/working/data"
checkpoint_dir: "/kaggle/working/checkpoints"
results_dir: "/kaggle/working/results"
truncation_strategy: "head_tail"
output_bias_init: "train_mean"
dropout: 0.1